# ═══════════════════════════════════════════════════════════
# CLOUDCANNON CONFIG — rafaelhijano.work
# ═══════════════════════════════════════════════════════════

paths:
  uploads: public/images
  static: public

timezone: Europe/Madrid

collections_config:
  
  portfolio:
    path: src/content/portfolio
    icon: image
    url: /portfolio/[slug]/
    output: true
    _inputs:
      title:
        type: text
        label: Título del proyecto

  config:
    path: src/content/config
    icon: settings
    output: false

  pages:
    path: src/pages
    icon: wysiwyg
    output: true
    filter:
      base: 'files'
      glob: '*.astro'

  pages_portfolio:
    path: src/pages/portfolio
    icon: folder_special
    output: true

collection_groups:
  - heading: Contenido de Trabajo
    collections:
      - portfolio
  - heading: Estructura y Páginas Web
    collections:
      - pages
      - pages_portfolio
  - heading: Ajustes Generales
    collections:
      - config

routes:
  - from: "src/content/portfolio/{slug}.md"
    to: "/portfolio/{slug}/"

  - from: "src/content/config/site.md"
    to: "/"

  - from: "src/pages/index.astro"
    to: "/"
  - from: "src/pages/{slug}.astro"
    to: "/{slug}/"

  # Reglas para las páginas .astro que están dentro de la subcarpeta portfolio
  - from: "src/pages/portfolio/index.astro"
    to: "/portfolio/"
  - from: "src/pages/portfolio/{slug}.astro"
    to: "/portfolio/{slug}/"
