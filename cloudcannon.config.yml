# ═══════════════════════════════════════════════════════════
# CLOUDCANNON CONFIG — rafaelhijano.work
# Framework: Astro 6  |  Node ≥22.12
# ═══════════════════════════════════════════════════════════

paths:
  static: public
  uploads: public/images

timezone: Europe/Madrid

# ═══════════════════════════════════════════════════════════
# COLECCIONES
# ═══════════════════════════════════════════════════════════
collections_config:

  # ── 1. PORTFOLIO ─────────────────────────────────────────
  # src/content/portfolio/*.md → genera /portfolio/<slug>/
  portfolio:
    path: src/content/portfolio
    url: "/portfolio/[slug]/"
    icon: image
    output: true
    sort:
      key: order
      order: asc
    _inputs:
      title:
        label: Título del proyecto
        type: text
      tagline:
        label: Tagline (tarjetas y listados)
        type: text
      desc:
        label: Descripción breve (tarjetas y listados)
        type: textarea
      subtitle:
        label: Subtítulo (página interior, bajo el título)
        type: text
      area:
        label: Área de trabajo
        type: text
        comment: "Ej: Branding — Editorial — UX/UI"
      rol:
        label: Rol en el proyecto
        type: text
      software:
        label: Software utilizado
        type: text
        comment: "Ej: Illustrator — After Effects — Figma"
      order:
        label: Orden en listados (1 = primero)
        type: number
      coverImg:
        label: Imagen de portada (home y listado)
        type: image
      coverAlt:
        label: Alt de la portada
        type: text
      heroImg:
        label: Imagen hero (interior del proyecto)
        type: image
      heroAlt:
        label: Alt del hero
        type: text
      wip:
        label: Proyecto en proceso (WIP)
        type: checkbox
      prevSlug:
        label: Slug del proyecto anterior
        type: text
        comment: "Nombre del archivo .md sin extensión. Ej: arbocala"
      prevLabel:
        label: Etiqueta del enlace anterior
        type: text
      nextSlug:
        label: Slug del proyecto siguiente
        type: text
      nextLabel:
        label: Etiqueta del enlace siguiente
        type: text

  # ── 2. CONFIGURACIÓN GLOBAL ───────────────────────────────
  # src/content/config/site.md → controla home, sobre-mí y currículum
  config:
    path: src/content/config
    icon: settings
    output: false
    _inputs:
      # HOME
      heroTitle:
        label: "HOME · Título principal"
        type: text
      heroBio:
        label: "HOME · Párrafo del hero"
        type: textarea
      heroImg:
        label: "HOME · Foto del hero"
        type: image
      heroImgAlt:
        label: "HOME · Alt de la foto"
        type: text

      # SOBRE MÍ
      photo:
        label: "SOBRE MÍ · Foto de perfil"
        type: image
      photoAlt:
        label: "SOBRE MÍ · Alt de la foto"
        type: text
      bio:
        label: "SOBRE MÍ · Párrafos de bio"
        type: array
        comment: "Cada elemento es un párrafo"
        _inputs:
          value:
            type: textarea
            label: Párrafo

      # EXPERIENCIA
      experience:
        label: "Experiencia laboral"
        type: array
        _inputs:
          role:
            label: Cargo
            type: text
          company:
            label: Empresa
            type: text
          period:
            label: Período
            type: text
            comment: "Ej: Feb 2025 — presente"
          companyDesc:
            label: Descripción de la empresa
            type: textarea
          tasks:
            label: Tareas
            type: array
            _inputs:
              value:
                type: textarea
                label: Tarea

      # EDUCACIÓN
      education:
        label: "Educación"
        type: array
        _inputs:
          title:
            label: Título / Grado
            type: text
          institution:
            label: Centro educativo
            type: text
          period:
            label: Años
            type: text

      # HABILIDADES (sobre mí)
      skills:
        label: "Habilidades (sobre mí)"
        type: array
        _inputs:
          value:
            type: text
            label: Habilidad

      # CURRÍCULUM
      cvIntro:
        label: "CV · Párrafo introductorio"
        type: textarea
      cvPdfPath:
        label: "CV · Ruta al PDF"
        type: text
        comment: "Ej: /cv-rafael-hijano.pdf"
      skillsSoftware:
        label: "CV · Software"
        type: array
        _inputs:
          value:
            type: text
            label: Software
      skillsAreas:
        label: "CV · Áreas"
        type: array
        _inputs:
          value:
            type: text
            label: Área

# ═══════════════════════════════════════════════════════════
# AGRUPACIÓN EN EL SIDEBAR
# ═══════════════════════════════════════════════════════════
collection_groups:
  - heading: Portfolio
    collections:
      - portfolio
  - heading: Configuración del sitio
    collections:
      - config

# ═══════════════════════════════════════════════════════════
# RUTAS EXPLÍCITAS
# Asocia cada archivo de colección a su URL pública.
# Esto activa el botón "Ver en el sitio" en CloudCannon.
# ═══════════════════════════════════════════════════════════
routes:
  - from: src/content/portfolio/arbocala.md
    to: /portfolio/arbocala/
  - from: src/content/portfolio/fiambre.md
    to: /portfolio/fiambre/
  - from: src/content/portfolio/andaluce.md
    to: /portfolio/andaluce/
  - from: src/content/config/site.md
    to: /
